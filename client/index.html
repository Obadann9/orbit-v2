<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />
    <script>
      try {
        if (localStorage.getItem("orbit-theme") !== "light") {
          document.documentElement.classList.add("dark");
        }
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
    <meta name="theme-color" content="#08080F" />
    <meta
      name="description"
      content="Orbit rewards and wallet — earn, manage, and move your points."
    />
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='16' fill='%236c5ce7'/%3E%3Cellipse cx='32' cy='32' rx='29' ry='14' fill='none' stroke='%23cff34a' stroke-width='4' transform='rotate(-22 32 32)'/%3E%3C/svg%3E"
    />
    <title>Orbit — Rewards in Motion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"
    ></script>
  </body>
</html>
